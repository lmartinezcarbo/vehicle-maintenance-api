# Infrastructure as code: this file IS the backend deployment.
# Render reads it as a Blueprint - from an empty workspace it creates
# the whole API, and edits re-sync on every push to main.
services:
  - type: web
    name: vehicle-maintenance-api
    runtime: docker
    plan: free
    # Immutable after creation: paired with the Neon database region
    # (US East 2 / Ohio) so every query stays inside one AWS region.
    region: ohio
    healthCheckPath: /health
    autoDeployTrigger: commit
    # preDeployCommand (the usual home for migrations) is paid-only, so
    # migrations run as part of startup: build -> migrate -> serve.
    # Render's documented shape for multi-command Docker starts: the
    # /bin/sh -c prefix and NO quotes - quotes become part of the
    # script, sh tries to exec the whole line as one file name and the
    # deploy dies with 127. ${PORT:-10000}: Render routes web traffic to
    # 10000 by default and does not inject $PORT for Docker; the
    # Dockerfile CMD keeps ${PORT:-8000} for local docker compose.
    dockerCommand: '/bin/sh -c alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}'
    envVars:
      # Generated by Render on first creation: never in git, never in
      # chat, regenerated only if the variable does not exist yet.
      - key: SECRET_KEY
        generateValue: true
      # Secrets and account-specific values, filled once in the Render
      # Dashboard (sync: false keeps them out of this file forever).
      - key: DATABASE_URL
        sync: false # Neon connection string with sslmode=require
      - key: STRIPE_SECRET_KEY
        sync: false # rotate before the first deploy
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # issued when the webhook endpoint is registered
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false # verified Brevo sender
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Non-secret values, versioned in git. The Stripe return URLs land
      # on the deployed frontend (/app/payments/... keeps the SPA route);
      # CORS allows it plus the local dev server.
      # CORS_ORIGINS only affects browsers, never curl.
      - key: CLOUDINARY_CLOUD_NAME
        value: ntslbtlt # already public in every delivered image URL
      - key: STRIPE_SUCCESS_URL
        value: https://vehicle-maintenance-frontend-nine.vercel.app/app/payments/success
      - key: STRIPE_CANCEL_URL
        value: https://vehicle-maintenance-frontend-nine.vercel.app/app/payments/cancel
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://vehicle-maintenance-frontend-nine.vercel.app,https://vehicle-maintenance-frontend-4vevnom4o-nest-worthy-llc.vercel.app
      # Public portfolio demo: lets the three seeded accounts sign in
      # without the emailed 2FA code, so a reviewer can try the live app.
      # Remove this line (or set it false) for a deployment serving real
      # users; the shortcut answers 404 as soon as the flag is off.
      - key: DEMO_MODE
        value: "true"
